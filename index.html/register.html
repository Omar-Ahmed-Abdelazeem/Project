<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>REGISTER</title>
        <link rel="stylesheet" href="../CSS/register.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <link rel="icon" href="../Photos/orca_icon.png">

        
    </head>
<body>    
    <p id="word_register">Register Form</p>

    
    <div class="main_border">
        <div id="words_inside_box1">
            <div id="words_inside_box2">
                
                <form target="_self" autocomplete="on" method="POST" action="login.html">
                    <div class="dis_flx">
                        <div>
                            <label for="fname" class="edit_label">First Name</label><br>
                            <input type="text" name="fname" required class="input_text"><br>
                        </div>

                        <div>
                            <label for="lname" class="edit_label">Last Name</label><br>
                            <input type="text" name="lname" required class="input_text"><br>
                        </div>  
                    </div>

                    <div class="dis_flx">
                        <div>
                            <label for="Uname" class="edit_label">EMAIL</label><br>
                            <input type="email" name="Uname" required class="input_text"><br>
                        </div>

                        <div>
                            <label for="birthday" class="edit_label">Birthday</label><br>
                            <input type="date" name="birthday" required class="input_text">    
                        </div>

                    </div>

                    <div class="dis_flx">
                        <div>
                            <label for="Pname" class="edit_label">Create Password</label><br>
                            <input type="password" name="Pname" required class="input_text"><br>                              
                        </div>

                         <div>
                            <label for="Pname" class="edit_label">Confirm Password</label><br>
                            <input type="password" name="Pname" required class="input_text"><br>                              
                        </div>

                    </div>
                    <div>
 
                        <label class="edit_label">Gender</label>      
                        <div class="dis_flx" id="gen_edit">
                            <div>
                                <input type="radio" required name="gender">
                                <label for="gender" class="edit_label">Male</label>                               
                            </div>  
                            <div>
                                <input type="radio" required name="gender">
                                <label for="gender" class="edit_label">Female</label>                               
                            </div>                            
                        </div>                         

                     
                    </div>



                    
                    <input type="submit" value="CRAETE" id="submit_button">
                    <div id="icons">
                        <i class="fab fa-facebook-f" id="face_icon"></i>
                        <i class="fab fa-google" id="goo_icon"></i>
                        <i class="fa-brands fa-x-twitter" id="twitt_icon"></i>
                        


                    </div>
                    
                </div>
                <p>Have an account? <a href="login.html">Login</a></p>
                
                
            </form>
        </div>
    </div>
    
    
    
    
</body>

</html>
