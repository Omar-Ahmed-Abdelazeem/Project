<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LOG IN</title>
        <link rel="stylesheet" href="../CSS/login.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <link rel="icon" href="../Photos/orca_icon.png">

        
        
    </head>
    <body>    
        <p id="word_welcome">Welcome Back</p>

        
        <div class="main_border">
            <div id="words_inside_box1">
                <h1 id="Log_word">LOG IN</h1>
                <div id="words_inside_box2">
                    
                <form target="_self" autocomplete="on" method="POST" action="index.html">
                        <label for="Uname" class="edit_label">EMAIL</label><br>
                        <input type="email" name="Uname" required class="input_text"><br>
                        
                        <label for="Pname" class="edit_label">PASSWORD</label><br>
                        <input type="password" name="Pname" required class="input_text"><br>
                        <div id="check">
                            <div>
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember">Remember</label>                        
                            </div>
                            <a id="forgot_pass">Forgot Password?</a>                        
                        </div>
                        
                        
                        <input type="submit" value="LOG IN" id="submit_button">
                        <div id="icons">
                            <i class="fab fa-facebook-f" id="face_icon"></i>
                            <i class="fab fa-google" id="goo_icon"></i>
                            <i class="fa-brands fa-x-twitter" id="twitt_icon"></i>

                        </div>
                        
                    </div>
                    <p>Don't have an account? <a href="register.html">Register</a></p>
                    
                    
                </form>
            </div>
        </div>
        
        
        
    </body>

</html>
